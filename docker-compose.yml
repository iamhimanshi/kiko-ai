services:
  postgres:
    image: postgres:15-alpine
    container_name: kiko-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kiko_user
      POSTGRES_PASSWORD: kiko_password
      POSTGRES_DB: kiko_db
    volumes:
      - kiko_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiko_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: kiko-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://kiko_user:kiko_password@postgres:5432/kiko_db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  kiko_postgres_data:
  