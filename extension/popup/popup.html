<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>KIKO AI — MindGuard</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 300px;
        background: #080B16;
        color: #F5F7FF;
        font-family: -apple-system, "Inter", sans-serif;
        padding: 20px;
      }
      .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
      .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: #6366F1; }
      .brand-name { font-weight: 600; font-size: 14px; letter-spacing: 0.02em; }

      .status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 13px; }
      .status-dot { width: 8px; height: 8px; border-radius: 50%; }
      .status-connected { background: #22D3EE; }
      .status-connecting { background: #818CF8; animation: pulse 1.4s infinite; }
      .status-disconnected { background: #F97316; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

      label { display: block; font-size: 12px; color: #A7AEC2; margin-bottom: 4px; }
      input {
        width: 100%; background: #151B2E; border: 1px solid #29324A; border-radius: 8px;
        padding: 9px 10px; color: #F5F7FF; font-size: 13px; margin-bottom: 10px; outline: none;
      }
      input:focus { border-color: #818CF8; }
      button {
        width: 100%; background: #6366F1; color: white; border: none; border-radius: 8px;
        padding: 10px; font-size: 13px; font-weight: 500; cursor: pointer;
      }
      button:hover { background: #4F46E5; }
      button:disabled { opacity: 0.6; cursor: default; }
      button.secondary { background: transparent; border: 1px solid #29324A; color: #A7AEC2; margin-top: 8px; }

      .error { color: #EF4444; font-size: 12px; margin-bottom: 10px; }
      .card { background: #151B2E; border: 1px solid #29324A; border-radius: 12px; padding: 14px; margin-top: 12px; }
      .goal { font-size: 11px; color: #6F7891; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
      .goal-text { font-size: 13px; color: #F5F7FF; margin-bottom: 10px; }
      .metric-row { display: flex; justify-content: space-between; font-size: 12px; color: #A7AEC2; margin-bottom: 4px; }
      .metric-value { color: #F5F7FF; font-weight: 500; }
      .muted { color: #6F7891; font-size: 12px; text-align: center; padding: 20px 0; }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">KIKO AI — MindGuard</span>
    </div>
    <div id="root"></div>
    <script src="popup.js"></script>
  </body>
</html>
