<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Focus Screen — DayDive</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="shield">
        <svg viewBox="0 0 24 24" width="44" height="44" fill="none" stroke="#FF841C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1>MindGuard blocked this website</h1>
      <p class="domain" id="domain">instagram.com</p>
      <p class="msg">
        This website is on your blocklist for the current study session.
        Stay focused — you'll thank yourself later.
      </p>
      <div class="actions">
        <button class="btn primary" id="back-btn">Return to Study</button>
        <button class="btn secondary" id="close-btn">Close Tab</button>
      </div>
      <p class="footer">Blocking is automatically disabled when your session ends.</p>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
