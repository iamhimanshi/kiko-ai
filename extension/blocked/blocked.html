<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Focus Screen — KIKO AI</title>
  <link rel="stylesheet" href="blocked.css" />
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="shield">🛡️</div>
      <h1>MindGuard blocked this website</h1>
      <p class="domain" id="domain">instagram.com</p>
      <p class="msg">
        This website is on your blocklist for the current study session.
        Stay focused — you'll thank yourself later.
      </p>
      <div class="actions">
        <button class="btn primary" id="back-btn">Return to Study</button>
        <button class="btn secondary" id="close-btn">Close Tab</button>
      </div>
      <p class="footer">Blocking is automatically disabled when your session ends.</p>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
